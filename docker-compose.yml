version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: jabvox_mail_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jabvox_mail}
      POSTGRES_USER: ${POSTGRES_USER:-jabvox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jabvox_secret}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jabvox -d jabvox_mail"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jabvox_mail_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3005}:3005"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jabvox}:${POSTGRES_PASSWORD:-jabvox_secret}@db:5432/${POSTGRES_DB:-jabvox_mail}?schema=public
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3005}
      - APP_SECRET=${APP_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}

volumes:
  pgdata:

